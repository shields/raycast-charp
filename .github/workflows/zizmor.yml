name: zizmor

on:
  push:
    branches: ["**"]
  pull_request: null

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # zizmorcore is zizmor's official org (woodruffw/zizmor redirects
      # there); zizmorcore/zizmor-action is the action docs.zizmor.sh
      # recommends, not a typosquat.
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          persona: pedantic
          # Fail the job on findings with inline annotations instead of
          # uploading SARIF to the Security tab, so branch protection gates
          # on a clean audit.
          advanced-security: false
          annotations: true
