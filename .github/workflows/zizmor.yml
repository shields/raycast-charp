name: zizmor

on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zizmorcore is zizmor's official org (woodruffw/zizmor redirects
      # there); zizmorcore/zizmor-action is the action docs.zizmor.sh
      # recommends, not a typosquat.
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          persona: pedantic
          # Fail the job on findings with inline annotations instead of
          # uploading SARIF to the Security tab, so branch protection gates
          # on a clean audit.
          advanced-security: false
          annotations: true
