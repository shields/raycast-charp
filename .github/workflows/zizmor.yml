name: zizmor

on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zizmorcore is zizmor's official org (woodruffw/zizmor redirects
      # there); zizmorcore/zizmor-action is the action docs.zizmor.sh
      # recommends, not a typosquat.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          persona: pedantic
          # Fail the job on findings with inline annotations instead of
          # uploading SARIF to the Security tab, so branch protection gates
          # on a clean audit.
          advanced-security: false
          annotations: true
